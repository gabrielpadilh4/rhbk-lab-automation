rhbk_version: 26.6.9
rhbk_offline_install: true
rhbk_download_path: "{{ inventory_dir }}"
rhbk_dest: /opt/rhbk
rhbk_systemd_wait_for_port_number: 8080

rhbk_proxy_headers: xforwarded
rhbk_hostname: "https://keycloak.corp.example.com"
rhbk_hostname_strict: false

rhbk_log: console,file
rhbk_log_level: info,org.keycloak.federation:TRACE

rhbk_additional_env_vars:
  - key: JAVA_OPTS_APPEND
    value: "-Dsun.security.krb5.debug=true -Dsun.security.spnego.debug=true"

rhbk_ha_enabled: true
rhbk_health_check_url: http://localhost:9000/health
rhbk_db_user: "keycloak"
# Secret sourced from group_vars/all/vault.yaml (Ansible Vault encrypted).
rhbk_db_pass: "{{ vault_db_password }}"
rhbk_db_url: "jdbc:postgresql://postgresql.corp.example.com:5432/keycloak"

# Secret sourced from group_vars/keycloak/vault.yaml (Ansible Vault encrypted).
rhbk_bootstrap_admin_password: "{{ vault_rhbk_bootstrap_admin_password }}"